<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Hello World</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8fafc;
      --muted: #b6c2d9;
      --aqua: #66e3ff;
      --rose: #ff7aa8;
      --gold: #ffd166;
      --panel: rgba(15, 23, 42, 0.68);
      --line: rgba(255, 255, 255, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 22% 16%, rgba(102, 227, 255, 0.25), transparent 34%),
        radial-gradient(circle at 82% 24%, rgba(255, 122, 168, 0.22), transparent 30%),
        radial-gradient(circle at 52% 88%, rgba(255, 209, 102, 0.2), transparent 34%),
        linear-gradient(135deg, #09111f 0%, #151a2e 48%, #07131a 100%);
    }

    .site-nav {
      position: fixed;
      top: 22px;
      left: 50%;
      z-index: 10;
      display: flex;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(8, 17, 31, 0.72);
      backdrop-filter: blur(20px);
      transform: translateX(-50%);
    }

    .site-nav a {
      padding: 10px 14px;
      border-radius: 6px;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .site-nav a:hover,
    .site-nav a.active {
      color: #08111f;
      background: linear-gradient(90deg, var(--aqua), var(--gold));
    }

    .stage {
      position: relative;
      width: min(92vw, 900px);
      margin: 96px 0 36px;
      padding: clamp(28px, 6vw, 72px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.48);
      backdrop-filter: blur(24px);
      isolation: isolate;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: -1px;
      z-index: -1;
      border-radius: inherit;
      background: linear-gradient(120deg, rgba(102, 227, 255, 0.7), rgba(255, 122, 168, 0.45), rgba(255, 209, 102, 0.6));
      opacity: 0.42;
      filter: blur(22px);
      transform: translateY(18px) scale(0.97);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
      gap: clamp(28px, 5vw, 58px);
      align-items: start;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 2px;
      background: linear-gradient(90deg, var(--aqua), var(--gold));
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 9vw, 6.6rem);
      line-height: 0.92;
      letter-spacing: 0;
      background: linear-gradient(90deg, #ffffff, #b9f5ff 34%, #ffd8e7 68%, #fff3ba);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      max-width: 50ch;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.7;
    }

    form {
      display: grid;
      gap: 14px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 800;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 13px 14px;
      color: var(--ink);
      background: rgba(8, 17, 31, 0.72);
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: var(--aqua);
      box-shadow: 0 0 0 3px rgba(102, 227, 255, 0.16);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: #08111f;
      background: linear-gradient(90deg, var(--aqua), var(--gold));
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 14px 34px rgba(102, 227, 255, 0.18);
      cursor: pointer;
    }

    .back-link {
      display: inline-flex;
      margin-top: 28px;
      color: var(--ink);
      font-weight: 800;
      text-decoration: none;
    }

    .back-link:hover {
      color: var(--gold);
    }

    @media (max-width: 760px) {
      body {
        align-items: stretch;
        padding: 18px;
      }

      .site-nav {
        width: calc(100% - 36px);
        justify-content: center;
      }

      .stage {
        align-self: center;
      }

      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Primary navigation">
    <a href="hello-world.html">Home</a>
    <a href="about.html">About</a>
    <a class="active" href="contact.html">Contact</a>
  </nav>

  <section class="stage" aria-label="Contact page">
    <div class="layout">
      <main>
        <p class="eyebrow">Start a conversation</p>
        <h1>Say hello back.</h1>
        <p>
          Drop a note, share an idea, or send a quick greeting. This form is
          designed for the page, ready to connect to real sending later.
        </p>
        <a class="back-link" href="hello-world.html">Back to Home</a>
      </main>

      <form>
        <label>
          Name
          <input type="text" name="name" placeholder="Your name">
        </label>
        <label>
          Email
          <input type="email" name="email" placeholder="you@example.com">
        </label>
        <label>
          Message
          <textarea name="message" placeholder="Write your message..."></textarea>
        </label>
        <button class="button" type="button">Send Message</button>
      </form>
    </div>
  </section>
</body>
</html>
